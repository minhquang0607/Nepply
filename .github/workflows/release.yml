name: Release build
# Tag push (vX.Y.Z) builds the distribution on a GitHub-hosted runner and
# attaches it to a DRAFT release; a maintainer reviews and publishes it by hand.
# workflow_dispatch is a dry run: it builds and uploads the artifact only.
#
# Artifacts are UNSIGNED until SignPath (or another approved signer) is
# integrated. Signing goes between the build and draft-release jobs: submit the
# unsigned artifact for signing, rebuild Setup with -SignedUninstallerDirectory,
# then sign Setup and regenerate checksums. See docs/release/PUBLIC_RELEASE_CHECKLIST.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  INNO_VERSION: 7.1.0
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNO_PUBLISHER: CN=Pyrsys B.V., O=Pyrsys B.V., S=Noord-Holland, C=NL
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Tag matches project version
        if: github.ref_type == 'tag'
        # Pass the tag as data, never as script text: ref names may contain quotes.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/Nepply/Nepply.csproj -Raw
          $expected = 'v' + [string]$project.Project.PropertyGroup.Version
          if ($env:TAG -cne $expected) { throw "Tag $env:TAG does not match project version $expected." }
      - name: Install Inno Setup ${{ env.INNO_VERSION }} (signature verified)
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -cne $env:INNO_PUBLISHER) {
            throw "Inno Setup installer signature rejected: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
          $compiler = 'C:\Program Files\Inno Setup 7\ISCC.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $compiler).Status -ne 'Valid') { throw 'Installed compiler signature is not valid.' }
      - run: dotnet restore Nepply.slnx --locked-mode
      - run: ./scripts/Test-BuildBoundary.ps1
      - run: ./scripts/Test-PublicSource.ps1
      - run: ./scripts/Test-LanguageResources.ps1
      - run: ./scripts/Test-InstallerContract.ps1
      - name: Build Setup and portable
        run: ./scripts/Build-Distribution.ps1 -OutputDirectory artifacts/release-ci -InternalOnly
      - name: Collect release files
        run: |
          $out = 'artifacts/release-upload'
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item artifacts/release-ci/installer/*.exe, artifacts/release-ci/*.zip, artifacts/release-ci/SHA256.json -Destination $out
          Get-ChildItem $out | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } | Format-Table -AutoSize | Out-String | Write-Output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nepply-release-unsigned
          path: artifacts/release-upload/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nepply-release-logs
          path: artifacts/release-ci/inno-compile.log
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 10
    # Add a required reviewer to this environment in repository settings.
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Join-Path $env:RUNNER_TEMP 'release'
          gh run download $env:GITHUB_RUN_ID --name nepply-release-unsigned --dir $files
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the build artifact.' }
          $assets = @(Get-ChildItem -LiteralPath $files -File | ForEach-Object FullName)
          $existing = gh release view $env:TAG --json isDraft 2>$null | ConvertFrom-Json
          if ($null -eq $existing) {
            gh release create $env:TAG @assets --draft --verify-tag --title "Nepply $($env:TAG.TrimStart('v'))" --notes 'UNSIGNED build. Review the assets and CHANGELOG before publishing.'
          } elseif ($existing.isDraft) {
            gh release upload $env:TAG @assets --clobber
          } else {
            throw "Release $env:TAG is already published; refusing to replace its assets."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach assets to the draft release.' }
