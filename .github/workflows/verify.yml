name: Verify Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore Nepply.slnx --locked-mode
      - run: ./scripts/Test-BuildBoundary.ps1
      - run: ./scripts/Test-PublicSource.ps1
      - run: ./scripts/Test-LanguageResources.ps1
      - run: dotnet build Nepply.slnx -c Release --no-restore
      - run: ./tests/Nepply.Tests/bin/Release/net10.0-windows10.0.19041.0/win-x64/Nepply.Tests.exe artifacts/ci-guardian --guardian-connection (Resolve-Path './src/Nepply.DesktopGuardian/bin/Release/net10.0-windows/win-x64/Nepply.DesktopGuardian.exe').Path
      - run: dotnet run --project tests/Nepply.Tests/Nepply.Tests.csproj -c Release --no-build --no-restore -- artifacts/ci-tests --core-only
      - run: dotnet run --project tests/Nepply.Tests/Nepply.Tests.csproj -c Release --no-build --no-restore -- artifacts/ci-ui --ui-only
      - run: dotnet tool install dotnet-stack --version 10.0.750501 --tool-path artifacts/ci-tools
      - run: ./scripts/Test-AppearanceCi.ps1
        timeout-minutes: 4
      - run: dotnet run --project tests/Nepply.Tests/Nepply.Tests.csproj -c Release --no-build --no-restore -- artifacts/ci-tray --tray-ui
      - run: dotnet run --project tests/Nepply.Tests/Nepply.Tests.csproj -c Release --no-build --no-restore -- artifacts/ci-dpi --dpi-layout
      - run: dotnet run --project tests/Nepply.Tests/Nepply.Tests.csproj -c Release --no-build --no-restore -- artifacts/ci-crash --crash-recovery
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wpf-rendering-reports
          path: |
            artifacts/ci-ui/
            artifacts/ci-appearance/
            artifacts/ci-tray/
            artifacts/ci-dpi/
            artifacts/ci-crash/
            artifacts/ci-guardian/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-test-report
          path: artifacts/ci-tests/verification.txt
          if-no-files-found: warn
          retention-days: 7
      - run: ./scripts/Test-DependencyGate.ps1
      - run: ./scripts/Test-ReleaseGate.ps1
      - run: ./scripts/Test-NoticeGate.ps1
      - run: ./scripts/Test-SdkProjectionGate.ps1
      - run: ./scripts/Test-ReleaseManifest.ps1
      - run: ./scripts/Test-InstallerContract.ps1
      - run: ./scripts/Test-ReleaseLayout.ps1
      - run: ./scripts/Verify-Dependencies.ps1
      - run: ./scripts/Verify-Dependencies.ps1 -Project src/Nepply.DesktopGuardian/Nepply.DesktopGuardian.csproj -Report artifacts/security/guardian-audit.json
      - run: dotnet publish src/Nepply/Nepply.csproj -c Release --no-restore -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o artifacts/ci-msix-payload
      - run: ./scripts/Verify-RuntimePayload.ps1 -Directory artifacts/ci-msix-payload
      - run: ./scripts/Publish-DesktopGuardian.ps1 -OutputDirectory artifacts/ci-msix-payload/guardian
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-report
          path: artifacts/security/*.json
          if-no-files-found: warn
          retention-days: 7
      - run: dotnet publish src/Nepply/Nepply.csproj -c Release -o artifacts/ci-release --no-restore
      - run: ./scripts/Publish-DesktopGuardian.ps1 -OutputDirectory artifacts/ci-release/guardian
      - run: ./scripts/Collect-ThirdPartyNotices.ps1 -Destination artifacts/ci-release/licenses -RequireComplete
      - run: ./scripts/Release-Manifest.ps1 -Directory artifacts/ci-release -Mode Create
      - run: ./scripts/Release-Manifest.ps1 -Directory artifacts/ci-release -Mode Verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-build
          path: artifacts/ci-release/
          retention-days: 7
